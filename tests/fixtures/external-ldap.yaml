---
# External LDAP integration scenario.

authelia_project_name: test-external-ldap
authelia_domain: example.com
authelia_acl_rules:
  - policy: one_factor
    domain: '*.{{ authelia_domain }}'
authelia_smtp_address: submission://smtp.example.com:587
authelia_smtp_username: auth@example.com
authelia_smtp_password: ci-dummy-smtp-password
authelia_jwt_secret: ci-dummy-jwt-secret-0123456789abcdef
authelia_session_secret: ci-dummy-session-secret-0123456789abcdef
authelia_storage_encryption_key: ci-dummy-encryption-key-01234567
authelia_ldap_password: ci-dummy-ldap-password
authelia_ldap_managed: false
authelia_ldap_base_dn: DC=example,DC=com
authelia_ldap_user: UID=service,OU=people,DC=example,DC=com
authelia_ldap:
  implementation: custom
  address: ldaps://ldap.example.com:636
  base_dn: DC=example,DC=com
  user: UID=service,OU=people,DC=example,DC=com
  users_filter: "(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))"
  groups_filter: "(&(member={dn})(objectClass=groupOfNames))"

authelia_render_assertions:
  required_files: [compose.yml, .env, authelia/configuration.yml]
  required_directories: []
  required_secrets: [JWT_SECRET, SESSION_SECRET, STORAGE_ENCRYPTION_KEY, SMTP_PASSWORD, LDAP_PASSWORD]
  configuration_contains:
    - "implementation: custom"
    - "address: ldaps://ldap.example.com:636"
    - "base_dn: DC=example,DC=com"
    - "user: UID=service,OU=people,DC=example,DC=com"
  configuration_not_contains: ["implementation: lldap"]
  compose_contains: ["  authelia:"]
  compose_not_contains: ["  ldap:", "LLDAP_JWT_SECRET_FILE:", "LLDAP_KEY_SEED:"]
  environment_contains: []
  environment_not_contains: [LLDAP_KEY_SEED]
