---
# Managed Caddy build scenario.

authelia_project_name: test-caddy
authelia_domain: example.com
authelia_acl_rules:
  - policy: one_factor
    domain: '*.{{ authelia_domain }}'
authelia_smtp_address: submission://smtp.example.com:587
authelia_smtp_username: auth@example.com
authelia_smtp_password: ci-dummy-smtp-password
authelia_jwt_secret: ci-dummy-jwt-secret-0123456789abcdef
authelia_session_secret: ci-dummy-session-secret-0123456789abcdef
authelia_storage_encryption_key: ci-dummy-encryption-key-01234567
authelia_ldap_password: ci-dummy-ldap-password
authelia_ldap_jwt_secret: ci-dummy-lldap-jwt-secret-0123456
authelia_ldap_key_seed: ci-dummy-key-seed-0123456789
authelia_caddy_managed: true
authelia_caddy_plugins:
  - github.com/caddy-dns/cloudflare
authelia_caddy_env:
  CF_API_TOKEN: ci-dummy-cf-token

authelia_render_assertions:
  required_files: [compose.yml, .env, authelia/configuration.yml, caddy/Dockerfile, caddy/Caddyfile]
  required_directories: [caddy, data/caddy]
  required_secrets: [JWT_SECRET, SESSION_SECRET, STORAGE_ENCRYPTION_KEY, SMTP_PASSWORD, LDAP_PASSWORD, LDAP_JWT_SECRET]
  configuration_contains: ["local:", "base_dn: DC=example,DC=com"]
  configuration_not_contains: ["identity_providers:"]
  compose_contains: ["  caddy:", "network_mode: host", "  ldap:"]
  compose_not_contains: ["  database:", "  redis:"]
  environment_contains: [CF_API_TOKEN]
  environment_not_contains: []
