---
# Extra services profile with OIDC clients, extra compose services and envs, and custom pre/post render hooks.

authelia_project_name: test-authelia
authelia_domain: example.com

# at least one ACL rule is required for the rendered configuration to be valid
authelia_acl_rules:
  - policy: 'one_factor'
    domain: '*.{{ authelia_domain }}'

# SMTP simple path
authelia_smtp_address: "submission://smtp.example.com:587"
authelia_smtp_username: "auth@example.com"
authelia_smtp_password: "ci-dummy-smtp-password"

# Core secrets — dummy values, rendered to files then discarded
authelia_jwt_secret: "ci-dummy-jwt-secret-0123456789abcdef"
authelia_session_secret: "ci-dummy-session-secret-0123456789abcdef"
authelia_storage_encryption_key: "ci-dummy-encryption-key-01234567"

authelia_oidc_clients:
  - client_name: "Test OIDC client"
    client_id: "test-client-id"
    client_secret: "$pbkdf2-sha512$310000$ZyYBc5jrNvb.n2YAZ.UAiQ$olMHxFUpCnsFVUzr9ZFRnt.zPuSl9vF/mnZlecPnZyEx.k.zNUesdpIB1Z7Q3V99cgVRlM0qDTRXGdVBwdrfpA" # hashed dummy value
    redirect_uris:
      - "https://example.com/callback"
    scopes:
      - openid
      - profile
      - email
  - client_name: "Admin service"
    client_id: "admin-client-id"
    client_secret: "$pbkdf2-sha512$310000$ZyYBc5jrNvb.n2YAZ.UAiQ$olMHxFUpCnsFVUzr9ZFRnt.zPuSl9vF/mnZlecPnZyEx.k.zNUesdpIB1Z7Q3V99cgVRlM0qDTRXGdVBwdrfpA" # hashed dummy value
    authorization_policy: "two_factor"
    redirect_uris:
      - "https://admin.example.com/oauth/callback"
    scopes:
      - openid
      - profile

authelia_oidc_authorization_policies:
  admin:
    default_policy: two_factor
    rules:
      - policy: two_factor
        subject: group:admins

authelia_oidc_claims_policies:
  default:
    id_token:
      - groups
      - email

authelia_authz_endpoints:
  forward-auth:
    implementation: ForwardAuth
    authn_strategies:
      - name: CookieSession

authelia_network_definitions:
  internal:
    - 192.168.1.0/24

authelia_user_attributes:
  department:
    display_name: Department
    required: false

authelia_extra_compose_envs:
  TEST_EXTRA_ENV: enabled

authelia_extra_compose_services:
  whoami:
    image: traefik/whoami:latest

authelia_extra_tasks: "{{ playbook_dir }}/hooks/test-stage.yaml"

