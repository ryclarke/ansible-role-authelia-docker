---
# Managed PostgreSQL storage scenario.

authelia_project_name: test-postgres
authelia_domain: example.com
authelia_acl_rules:
  - policy: one_factor
    domain: '*.{{ authelia_domain }}'
authelia_smtp_address: submission://smtp.example.com:587
authelia_smtp_username: auth@example.com
authelia_smtp_password: ci-dummy-smtp-password
authelia_jwt_secret: ci-dummy-jwt-secret-0123456789abcdef
authelia_session_secret: ci-dummy-session-secret-0123456789abcdef
authelia_storage_encryption_key: ci-dummy-encryption-key-01234567
authelia_ldap_password: ci-dummy-ldap-password
authelia_ldap_jwt_secret: ci-dummy-lldap-jwt-secret-0123456
authelia_ldap_key_seed: ci-dummy-key-seed-0123456789
authelia_storage_backend: postgres
authelia_storage_postgres_managed: true
authelia_storage_postgres_password: ci-dummy-postgres-password

authelia_render_assertions:
  required_files: [compose.yml, .env, authelia/configuration.yml]
  required_directories: [data/postgres]
  required_secrets: [JWT_SECRET, SESSION_SECRET, STORAGE_ENCRYPTION_KEY, SMTP_PASSWORD, LDAP_PASSWORD, LDAP_JWT_SECRET, STORAGE_PASSWORD]
  configuration_contains: ["postgres:", "address: tcp://authelia_db:5432"]
  configuration_not_contains: ["  local:"]
  compose_contains: ["  database:", "POSTGRES_USER:", "POSTGRES_PASSWORD_FILE:", "AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE:", "  ldap:"]
  compose_not_contains: ["  redis:", "  caddy:"]
  environment_contains: []
  environment_not_contains: []
