---
name: Ansible Galaxy Import
on:
  release:
    types:
      - published

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: pipx install ansible

      - name: Import versions into Ansible Galaxy
        env:
          TOKEN: "${{ secrets.ANSIBLE_GALAXY_TOKEN }}"
        run: ansible-galaxy import "${{ github.repository_owner }}" "${{ github.event.repository.name }}" --token "${TOKEN}"
