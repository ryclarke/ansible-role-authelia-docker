---
authelia_project_name: authelia
authelia_network_name: "{{ authelia_project_name }}"
authelia_root: "/opt/{{ authelia_project_name }}"

authelia_port: 9091
authelia_log_level: info

authelia_domain: ""  # required
authelia_subdomain: auth
authelia_timezone: "Etc/UTC"
authelia_theme: ""
authelia_assets: ""

authelia_ntp: udp://time.cloudflare.com:123
authelia_default_2fa: totp

# Replace the entire default configuration template (ADVANCED)
authelia_configuration_template: configuration.yml.j2

# --- Usage Configuration (Application Logic) ---
# These blocks are MERGED or APPENDED to. Safe to extend incrementally.
# Used for: ACL rules, OIDC clients, AuthZ endpoints, Network and User Attributes definitions.

# https://www.authelia.com/configuration/security/access-control/
# https://www.authelia.com/reference/guides/rule-operators/
authelia_acl_default_policy: deny
authelia_acl_rules: []

# https://www.authelia.com/configuration/identity-providers/openid-connect/clients/
authelia_oidc_clients: []

# https://www.authelia.com/configuration/miscellaneous/server-endpoints-authz/
# https://www.authelia.com/reference/guides/proxy-authorization/
authelia_authz_endpoints: {}

# https://www.authelia.com/configuration/definitions/network/
authelia_network_definitions: {}

# https://www.authelia.com/configuration/definitions/user-attributes/
authelia_user_attributes: {}

# Generate new secrets using this guide for initial bootstrapping:
# https://www.authelia.com/reference/guides/generating-secure-values/

# secrets — required:
authelia_jwt_secret: ""
authelia_session_secret: ""
authelia_ldap_password: ""
authelia_storage_encryption_key: ""
authelia_oidc_jwks_private_key: ""

# secret for SMTP notifications — conditionally required:
authelia_smtp_password: ""

# secrets for managed LDAP — conditionally required:
authelia_ldap_jwt_secret: ""
authelia_ldap_key_seed: ""

# secrets for Postgres and Redis — conditionally required:
authelia_storage_postgres_password: ""
authelia_redis_password: ""

authelia_caddy_managed: false  # deploy the local caddy service via docker compose
authelia_caddy_plugins: []
authelia_caddy_env: {}

# --- Integration Blocks (Infrastructure Topology) ---
# WARNING: Providing a custom block REPLACES the default entirely.
# Do not merge; these define the connection topology.
# Only customize these if you are switching providers (e.g., external SMTP, custom LDAP).
# For simple managed cases, leave these at defaults.

# WARNING: Disabling SMTP prevents password resets and account recovery emails from reaching users.
authelia_smtp_enabled: true
authelia_smtp_address: ""   # required unless disabled
authelia_smtp_username: ""  #
authelia_smtp:
  # Transport Configuration block: Replaced entirely if overridden.
  # Used for: Custom TLS settings, custom sender addresses, or other
  # configuration settings not covered by defaults.
  #
  # https://www.authelia.com/configuration/notifications/smtp/
  address: "{{ authelia_smtp_address }}"
  username: "{{ authelia_smtp_username }}"
  sender: "Authelia <{{ authelia_smtp_username }}>"
  identifier: "{{ authelia_domain }}"

# https://www.authelia.com/reference/integrations/ldap-integrations/
authelia_ldap_managed: true
authelia_ldap_base_dn: ""  # required for non-lldap implementations
authelia_ldap_user: ""     #
authelia_ldap:
  # Implementation block: Replaced entirely if overridden.
  # Used for: Implementation type, Address, Filters, Base DN, Bind User.
  # Note: 'base_dn' and 'user' in this block are overridden by derived facts
  # if using lldap and no explicit values are set.
  #
  # https://www.authelia.com/configuration/first-factor/ldap/
  implementation: lldap
  address: ldap://authelia_ldap:3890
  users_filter: "(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))"
  groups_filter: "(&(member={dn})(objectClass=groupOfNames))"
  base_dn: "{{ authelia_ldap_base_dn_final }}"
  user: "{{ authelia_ldap_user_final }}"

# https://www.authelia.com/reference/integrations/database-integrations/
authelia_storage_backend: local  # Options: 'local' (SQLite), 'postgres'
authelia_storage_postgres_managed: false
authelia_storage_postgres:
  # Implementation block: Replaced entirely if overridden.
  # Used for: Connection string, Database name, Username, TLS settings.
  #
  # https://www.authelia.com/configuration/storage/postgres/
  address: tcp://authelia_db:5432
  database: "{{ authelia_storage_postgres.username }}"
  username: authelia

# https://www.authelia.com/reference/integrations/cache-integrations/
authelia_redis_enabled: false
authelia_redis_managed: false
authelia_redis:
  # Implementation block: Replaced entirely if overridden.
  # Used for: Host, Port, TLS settings.
  #
  # https://www.authelia.com/configuration/session/redis/
  host: authelia_redis
  port: 6379

# Extra services (and environment variables) to deploy into the Compose project.
authelia_compose_extra_services: {}
authelia_compose_extra_envs: {}

authelia_images_authelia: "docker.io/authelia/authelia:latest"
authelia_images_caddy_builder: "caddy:2-builder"
authelia_images_caddy_runtime: "caddy:2-alpine"
authelia_images_lldap: "docker.io/lldap/lldap:latest-alpine-rootless"
authelia_images_postgres: "postgres:18-alpine"
authelia_images_redis: "redis:8-alpine"

authelia_service_secrets:
  authelia: [JWT_SECRET, SESSION_SECRET, SMTP_PASSWORD, LDAP_PASSWORD, STORAGE_ENCRYPTION_KEY, STORAGE_PASSWORD, REDIS_PASSWORD]
  ldap: [LDAP_PASSWORD, LDAP_JWT_SECRET]
  postgres: [STORAGE_PASSWORD]
  redis: [REDIS_PASSWORD]

authelia_hardening:
  _defaults: &std_hardening
    group: 0
    cap_drop_all: true
    no_new_privileges: true
  authelia:
    <<: *std_hardening # read_only requires healthcheck disabled in config
    user: 899
    read_only: true
    tmpfs: [/tmp]
  caddy:
    <<: *std_hardening
    user: 898
    read_only: true
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp, /config]
  ldap:
    <<: *std_hardening
    user: 897
    read_only: true
  postgres:
    <<: *std_hardening
    user: 896
    read_only: false # writes outside data dir
  redis:
    <<: *std_hardening
    user: 895
    read_only: false # writes outside data dir
