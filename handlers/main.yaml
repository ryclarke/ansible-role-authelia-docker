---
- name: Reconcile compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ authelia_root }}"
    state: present
    build: always
  listen: reconcile

- name: Restart authelia
  ansible.builtin.command:
    cmd: docker compose restart authelia
    chdir: "{{ authelia_root }}"
  changed_when: false
  when: not authelia_first_run | default(true)
  listen: restart authelia

- name: Reload caddy
  ansible.builtin.command:
    cmd: docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ authelia_root }}"
  changed_when: false
  when: not authelia_first_run | default(true)
  listen: reload caddy
